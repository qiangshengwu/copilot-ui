# =============================================================================
# copilot web 容器 nginx 站点配置（镜像内 /etc/nginx/conf.d/default.conf）
# 职责：1) SPA 静态资源 + history 路由回退；2) 反代 agent（/{workspaceID} 租户路由）。
# agent 独立部署时运行在宿主机 9091；容器内经 host.docker.internal 访问
# （Linux 宿主机运行需 --add-host host.docker.internal:host-gateway，见 Makefile run）。
# =============================================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 文本资源（HTML/JS/CSS），对 SSE 接口不影响（见下方 location ~）
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml;

    # ---------- SPA 路由回退 ----------
    # 前端为 React/Umi history 路由，未命中物理文件时一律回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 反代后端 agent（含 SSE 长连接） ----------
    # 会话与任务统一托管在 /{workspaceID}/copilot 下：conversations、task（任务含 SSE）。
    # 正则 location 只匹配这两族路径；proxy_pass 不带 URI，完整原始 URI 原样转发，
    # 与 agent 端路由（/{workspaceID}/copilot/...）精确对齐。
    location ~ ^/([^/]+)/copilot/(conversations|task) {
        proxy_pass http://host.docker.internal:9091;

        # HTTP/1.1 + 空 Connection，是 SSE/keep-alive 长连接的前提
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 关键：关闭缓冲与缓存，否则 SSE 逐字事件会被 nginx 攒住直到响应结束，
        # 前端表现为"转圈很久后一次性出字"。后端已自报 X-Accel-Buffering: no，
        # 这里再显式关一层双保险。
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   X-Accel-Buffering no;

        # 长任务流式回答可能持续数分钟，读/写超时放宽到 1 小时；建连超时保持短。
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
        proxy_connect_timeout 10s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 健康检查 ----------
    location /health {
        proxy_pass http://host.docker.internal:9091;
        proxy_set_header Host $host;
    }
}
